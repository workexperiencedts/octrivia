<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Octrivia"><meta name="theme-color" content="#0b0816"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Octrivia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one arcade cabinet standing on a dark arcade-carpet floor. Marquee, screen (with side art) and
   control deck stack top to bottom; on short landscape phones the deck moves beside the screen.
   All sizes are set by JS so the 16:9 screen always fits the window. Deliberately one dark arcade look. */
:root {
  --floor: #0b0816;
  --dot-chad: rgba(63, 196, 255, .14);
  --dot-demon: rgba(255, 59, 79, .13);
  --dot-gold: rgba(255, 201, 60, .10);
  --chad-glow: rgba(63, 196, 255, .26);
  --demon-glow: rgba(255, 59, 79, .24);
  --gold: #ffc93c;
  --cab: #150f28;
  --cab-hi: #2b2052;
  --cab-edge: #000000;
  --bezel: #040307;
  --bezel-line: #1f1a2e;
  --deck: #1c1534;
  --deck-hi: #33285e;
  --label: #f3edff;
  --label-dim: #a397c9;
  --shoot: #ff2e4d;
  --shoot-hi: #ff9aab;
  --shoot-lo: #8f0c22;
  --shoot-glow: rgba(255, 46, 77, .55);
  --stick: #e8e2f7;
  --stick-ball: #ff2e4d;
  --stick-base: #0d0a19;
  --shadow: rgba(0, 0, 0, .5);
  --screen-off: #000000;
  --focus: #ffc93c;
  --font-pixel: "Press Start 2P", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --screen-w: 640px; --screen-h: 360px; --mq-h: 56px; --deck-h: 120px; --deck-w: 660px;
  --side-w: 0px; --gap: 8px; --cab-pad: 10px; --bezel-pad: 8px; --shoot-size: 84px;
  color-scheme: dark;
}
html { box-sizing: border-box; }
html, body { height: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }   /* phones: the visible height, not behind the browser bars */
body {
  margin: 0; background: var(--floor); color: var(--label); font-family: var(--font-pixel);
  overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  touch-action: manipulation; -webkit-touch-callout: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
#room {
  box-sizing: border-box; height: 100%; display: grid; place-items: center;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--floor);
  background-image:
    radial-gradient(circle at 18% 26%, var(--dot-chad) 0 5px, transparent 6px),
    radial-gradient(circle at 68% 62%, var(--dot-demon) 0 6px, transparent 7px),
    radial-gradient(circle at 42% 88%, var(--dot-gold) 0 3px, transparent 4px);
  background-size: 72px 72px, 96px 96px, 54px 54px;
}
#cab {
  display: grid; grid-template-areas: "mq" "screen" "deck"; justify-items: center; gap: var(--gap);
  padding: var(--cab-pad);
  background: linear-gradient(180deg, var(--cab-hi) 0%, var(--cab) 14%, var(--cab) 86%, var(--cab-hi) 100%);
  border-radius: 22px 22px 12px 12px;
  box-shadow: 0 0 0 3px var(--cab-edge), 0 0 50px var(--chad-glow), 0 0 90px var(--demon-glow);
}
#mq {
  grid-area: mq; display: block; width: var(--deck-w); height: var(--mq-h); border-radius: 10px;
  image-rendering: crisp-edges; image-rendering: pixelated;
  box-shadow: 0 0 0 2px var(--cab-edge), 0 0 22px var(--chad-glow);
}
#screenrow { grid-area: screen; display: flex; gap: var(--gap); align-items: center; }
.side {
  display: block; width: var(--side-w); height: calc(var(--screen-h) + 2 * var(--bezel-pad));
  image-rendering: crisp-edges; image-rendering: pixelated; border-radius: 8px;
}
#bezel {
  padding: var(--bezel-pad); background: var(--bezel); border-radius: 14px;
  box-shadow: inset 0 0 0 2px var(--bezel-line), 0 0 0 2px var(--cab-edge);
}
#game {
  display: block; width: var(--screen-w); height: var(--screen-h); border-radius: 6px; background: var(--screen-off);
  image-rendering: crisp-edges; image-rendering: pixelated; cursor: crosshair; touch-action: none;
}
#deck {
  grid-area: deck; box-sizing: border-box; width: var(--deck-w); height: var(--deck-h);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 clamp(10px, 3%, 28px);
  background: linear-gradient(180deg, var(--deck-hi), var(--deck)); border-radius: 12px;
  box-shadow: 0 0 0 2px var(--cab-edge);
}
#stick { position: relative; flex: none; width: calc(var(--shoot-size) * .85); height: var(--shoot-size); }
#stick::before {
  content: ""; position: absolute; left: 8%; right: 8%; bottom: 6%; height: 34%; border-radius: 50%;
  background: var(--stick-base); box-shadow: 0 0 0 3px var(--cab-edge), inset 0 3px 0 var(--deck-hi);
}
#stick .lever {
  position: absolute; left: 50%; bottom: 22%; width: 40%; height: 72%;
  transform-origin: 50% 100%; transform: translateX(-50%) rotate(var(--tilt, 0deg)); transition: transform .08s;
}
#stick .rod { position: absolute; left: 41%; bottom: 0; width: 18%; height: 70%; background: var(--stick); border-radius: 3px; }
#stick .ball {
  position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--shoot-hi) 0 14%, var(--stick-ball) 48%, var(--shoot-lo) 100%);
  box-shadow: 0 0 0 3px var(--cab-edge);
}
#shoot {
  flex: none; position: relative; width: var(--shoot-size); height: var(--shoot-size);
  border: 0; padding: 0; border-radius: 50%; cursor: pointer; touch-action: manipulation;
  background: radial-gradient(circle at 34% 28%, var(--shoot-hi) 0 12%, var(--shoot) 42%, var(--shoot-lo) 100%);
  box-shadow: 0 7px 0 var(--shoot-lo), 0 0 0 4px var(--cab-edge), 0 10px 18px var(--shadow);
  color: var(--label); font: inherit; font-size: clamp(9px, calc(var(--shoot-size) * .13), 15px);
  letter-spacing: .06em; text-shadow: 0 2px 0 var(--shoot-lo);
  transition: transform .06s, box-shadow .06s;
}
#shoot.down {
  transform: translateY(5px);
  box-shadow: 0 2px 0 var(--shoot-lo), 0 0 0 4px var(--cab-edge), 0 4px 10px var(--shadow);
}
#shoot.ready { animation: shootPulse 1s ease-in-out infinite; }
@keyframes shootPulse {
  50% { box-shadow: 0 7px 0 var(--shoot-lo), 0 0 0 4px var(--cab-edge), 0 0 30px 8px var(--shoot-glow); }
}
#minis { display: flex; flex-direction: column; gap: 8px; flex: none; }
.mini {
  font: inherit; font-size: clamp(8px, calc(var(--deck-h) * .068), 13px); color: var(--label);
  background: var(--cab); border: 2px solid var(--deck-hi); border-bottom-width: 4px; border-radius: 6px;
  padding: .85em 1em; cursor: pointer; letter-spacing: .05em; min-width: 10.5em; touch-action: manipulation;
}
.mini:active { transform: translateY(2px); border-bottom-width: 2px; }
.mini[aria-pressed="true"] { color: var(--gold); }
#shoot:focus-visible, .mini:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
#cab.compact { grid-template-areas: "screen deck"; align-items: center; }
#cab.compact #mq, #cab.compact #stick { display: none; }
#cab.compact #deck { flex-direction: column; justify-content: center; gap: 14px; padding: 10px 8px; }
#cab.narrow #stick { display: none; }
#cab.narrow #deck { justify-content: space-around; }

/* The answer pad: on a tall screen (phone or iPad held upright) the clue and one big button per barrel sit under the screen. */
#cab.padded { grid-template-areas: "mq" "screen" "pad" "deck"; }
#cab.nomq { grid-template-areas: "screen" "deck"; }
#cab.nomq.padded { grid-template-areas: "screen" "pad" "deck"; }
#cab.nomq #mq { display: none; }

/* Phones and iPads: no SHOOT deck (tapping the screen or an answer does everything) and a thin cabinet,
   so the screen with the octopus and the hero gets as much of the display as it can. */
body.touch #room {
  padding: max(2px, env(safe-area-inset-top, 0px)) max(2px, env(safe-area-inset-right, 0px)) max(2px, env(safe-area-inset-bottom, 0px)) max(2px, env(safe-area-inset-left, 0px));
}
#bar { grid-area: bar; box-sizing: border-box; width: var(--deck-w); height: var(--bar-h); display: flex; align-items: center; gap: 8px; }
#barLogo { flex: 1; text-align: center; white-space: nowrap; font-size: clamp(14px, 5.2vw, 30px); letter-spacing: .04em; text-shadow: 0 3px 0 #000000; }
#barLogo b { font-weight: normal; color: #5ec8ff; }
#barLogo i { font-style: normal; color: #ffd24a; }
.tb {
  flex: none; font: inherit; font-size: clamp(10px, calc(var(--bar-h) * .22), 15px); letter-spacing: .05em; color: var(--label); min-height: 40px; min-width: 66px; padding: 0 10px;
  background: var(--deck-hi); border: 2px solid #4a3d82; border-bottom-width: 4px; border-radius: 8px; cursor: pointer; touch-action: manipulation;
}
.tb:active { transform: translateY(2px); border-bottom-width: 2px; }
.tb[aria-pressed="false"] { color: var(--label-dim); }
.tb:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
#cab.touch { grid-template-areas: "bar" "screen"; border-radius: 14px; }
#cab.touch.padded { grid-template-areas: "bar" "screen" "pad"; }
#cab.touch #deck, #cab.touch #mq { display: none; }
/* held sideways: the buttons stand in a thin column beside the screen, which then gets the full height */
#cab.touch.sideways { grid-template-areas: "screen bar"; align-items: center; }
#cab.touch.sideways #bar { flex-direction: column; justify-content: center; width: var(--bar-w); height: auto; }
#cab.touch.sideways #barLogo { display: none; }
#cab.touch.sideways .tb { width: 100%; min-width: 0; padding: 0 4px; min-height: calc(var(--bar-w) * .8); font-size: clamp(10px, calc(var(--bar-w) * .16), 15px); }
#pad {
  grid-area: pad; box-sizing: border-box; width: var(--deck-w); height: var(--pad-h);
  display: flex; flex-direction: column; gap: 8px; padding: 10px;
  background: var(--bezel); border-radius: 12px; overflow: hidden;
  box-shadow: inset 0 0 0 2px var(--bezel-line), 0 0 0 2px var(--cab-edge);
}
#padHead { margin: 0; flex: none; color: var(--gold); font-size: clamp(9px, 2.6vw, 14px); line-height: 1.5; text-align: center; }
#padClue { margin: 0; flex: none; color: #ffffff; font-size: clamp(10px, 3vw, 16px); line-height: 1.6; text-align: center; }
#padTimer { flex: none; height: 6px; border-radius: 3px; background: #14101f; overflow: hidden; }
#padTimer span { display: block; height: 100%; width: 100%; margin: 0 auto; background: #7dff9a; }
#padGrid {
  flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(var(--pad-cols, 4), 1fr);
  grid-auto-rows: minmax(38px, 76px); align-content: start; align-content: safe center; gap: 6px; overflow-y: auto;   /* scrolls only on the very smallest phones */
}
#padGrid button {
  font: inherit; font-size: clamp(10px, 2.9vw, 14px); line-height: 1.4; letter-spacing: .02em;
  color: #3a2410; background: #f4e2b8; border: 2px solid #6c3a18; border-bottom-width: 5px; border-radius: 7px;
  padding: 4px 3px; cursor: pointer; overflow-wrap: anywhere; touch-action: manipulation;
}
#padGrid.heroes { grid-template-columns: 1fr; grid-auto-rows: minmax(48px, 64px); }
#pad.demon #padGrid button { color: #ffd27a; background: #2a1416; border-color: #ff8a2a; }
#padGrid button:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
#padGrid button:disabled { opacity: .5; cursor: default; }
#padGrid button.sel { outline: 3px solid var(--gold); outline-offset: 1px; }
#pad #padGrid button.right { color: #0b2a12; background: #7dff9a; border-color: #1aa845; opacity: 1; }
#pad #padGrid button.wrong { color: #3a0808; background: #ff8a8a; border-color: #b81414; opacity: 1; }
#padGrid button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Pause menu and sound panel: full-window overlays with big, thumb-sized buttons */
.overlay {
  position: fixed; inset: 0; z-index: 10; box-sizing: border-box; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(7, 5, 26, .78);
}
.panel {
  box-sizing: border-box; width: min(380px, 100%); max-height: 100%; overflow: auto;
  display: flex; flex-direction: column; gap: 12px; padding: 22px 18px; text-align: center;
  background: var(--cab); border-radius: 16px;
  box-shadow: 0 0 0 3px var(--cab-edge), 0 0 0 6px var(--deck-hi), 0 0 50px var(--chad-glow);
}
.panel h2 { margin: 0 0 6px; font-size: 22px; font-weight: normal; color: var(--gold); letter-spacing: .08em; text-shadow: 0 3px 0 #000000; }
.big {
  font: inherit; font-size: 14px; letter-spacing: .06em; color: var(--label); min-height: 50px; padding: 12px;
  background: var(--deck-hi); border: 2px solid #4a3d82; border-bottom-width: 5px; border-radius: 9px;
  cursor: pointer; touch-action: manipulation;
}
.big:active { transform: translateY(2px); border-bottom-width: 3px; }
.big.go { background: var(--shoot); border-color: var(--shoot-lo); }
.big[aria-pressed="false"] { color: var(--label-dim); }
.big:focus-visible, .vol input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.vol { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 11px; color: var(--label-dim); }
.vol input { width: 100%; height: 34px; margin: 0; accent-color: var(--gold); cursor: pointer; }
.vol output { min-width: 3.5em; text-align: right; color: var(--label); }
.panel .note { margin: 0; font-size: 9px; line-height: 1.7; color: var(--label-dim); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
@media (prefers-reduced-motion: reduce) {
  #shoot.ready { animation: none; box-shadow: 0 7px 0 var(--shoot-lo), 0 0 0 4px var(--cab-edge), 0 0 24px 6px var(--shoot-glow); }
  #stick .lever, #shoot { transition: none; }
}
</style>

<div id="room">
  <main id="cab" aria-label="Octrivia arcade cabinet">
    <canvas id="mq" width="320" height="32" aria-hidden="true"></canvas>

<div id="pauseMenu" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pmTitle" hidden>

</div>

<script>
'use strict';
/* =====================================================================
   OCTRIVIA (Chad Mode vs Demon Time)
   One-file arcade game. Everything is drawn in code as pixel art and
   every sound is made with the Web Audio API.
   ===================================================================== */

/* ---------- tuning: change these to make the game easier or harder ---------- */
const CFG = {
  coins: 2,                                  // lifelines, shown as CREDITS
  keysNeeded: 3,                             // keys to unlock the next stage
  bossHits: 3,                               // hits to beat the giant demon octopus
  barrels: { chad: 4, demon: 8, boss: 8 },
  decideSeconds: 20,                        // time to pick a barrel once the clue is up; shown as a shrinking line, never a number
  // Clues are trivia questions about the places on the barrels: see TRIVIA in the trivia section.
};

/* ---------- small helpers ---------- */
const W = 640, H = 360, TAU = Math.PI * 2;
const noop = () => {};
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}
function hexRgb(hex) { const n = parseInt(hex.slice(1, 7), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) {
  const c = v => clamp(Math.round(v), 0, 255);
  return '#' + ((1 << 24) | (c(r) << 16) | (c(g) << 8) | c(b)).toString(16).slice(1);
}
function shade(hex, amt) {
  const [r, g, b] = hexRgb(hex);
  if (amt >= 0) return rgbHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
  return rgbHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
}
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return rgbHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }

/* ---------- pixel drawing ---------- */
// pen(g, ox, oy) returns R(x, y, w, h, colour): a rectangle in pixel units, offset by (ox, oy)
function pen(g, ox = 0, oy = 0) {
  return (x, y, w, h, c) => { if (!c) return; g.fillStyle = c; g.fillRect(ox + x, oy + y, w, h); };
}
function line(R, x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let guard = 0; guard < 2000; guard++) {
    R(x0, y0, 1, 1, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }

function drawTears(g, id, x, ground, u, t) {

const REDUCED_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const parts = [];
function spawn(p) {
  if (parts.length > 650) parts.splice(0, parts.length - 650);
  parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, life: 1, t: 0, s: 2, c: '#ffffff', type: 'sq', view: 'side', rot: 0, vr: 0 }, p));
}
function updParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt;
    if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.floor != null && p.y > p.floor) { p.y = p.floor; p.vy *= -0.3; p.vx *= 0.5; if (Math.abs(p.vy) < 25) p.vy = 0; }
  }
}

    const s = p.shrink ? Math.max(1, p.s * (1 - k)) : p.s;

      }
      case 'smoke': { const ss = p.s * (1 + k * 1.6); g.fillStyle = p.c; g.fillRect(Math.round(p.x - ss / 2), Math.round(p.y - ss / 2), Math.round(ss), Math.round(ss)); break; }
      case 'spark': {
        g.fillStyle = p.c;
        for (let j = 0; j < 3; j++) g.fillRect(Math.round(p.x - p.vx * 0.012 * j), Math.round(p.y - p.vy * 0.012 * j), 2, 2);
        break;
      }
      case 'confetti': {
        const h = Math.max(1, Math.round(s * Math.abs(Math.cos(p.rot))));
        g.fillStyle = p.c; g.fillRect(Math.round(p.x - s / 2), Math.round(p.y - h / 2), Math.round(s), h); break;
      }
      case 'star': { const sp = starSprite(p.c), d = Math.max(3, Math.round(sp.width * s / 4)); g.drawImage(sp, Math.round(p.x - d / 2), Math.round(p.y - d / 2), d, d); break; }
      case 'heart': { const sp = heartSprite(); g.drawImage(sp, Math.round(p.x - 9), Math.round(p.y - 8), 18, 16); break; }
      case 'flash': orb(g, p.x, p.y, Math.max(1, Math.round(p.s * (1 - k))), p.cols); break;
      case 'shard': { const sp = keySprite(); g.save(); g.translate(Math.round(p.x), Math.round(p.y)); g.rotate(p.rot); g.drawImage(sp, p.sx, p.sy, p.sw, p.sh, -p.sw, -p.sh, p.sw * 2, p.sh * 2); g.restore(); break; }
      case 'coin': { const sp = coinSprite(); const w = Math.max(1, Math.round(14 * Math.abs(Math.cos(p.rot)))); g.drawImage(sp, Math.round(p.x - w / 2), Math.round(p.y - 7), w, 14); break; }
      default: g.fillStyle = p.c; g.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), Math.round(s), Math.round(s));
    }

/* ---------- live gun effects (flames, glows, spinning saw...) ---------- */
function gunFx(g, gunId, gx, gy, t) {
  const u = FPG.u, gd = GUNS[gunId];
  const W2 = (cx, cy) => [gx + (cx + FPG.pad) * u, gy + (cy + FPG.pad) * u];
  const [mx, my] = W2(gd.muz[0], gd.muz[1]);
  const flick = Math.floor(t * 16);
  switch (gunId) {
    case 'blue':
      for (const [vx, vy] of gd.vents) {
        const [x, y] = W2(vx, vy);
        for (let j = 0; j < 4; j++) {
          const h = (flick + j * 3 + vx) % 4;
          g.fillStyle = j === 0 ? '#ffffff' : j < 2 ? '#a9ccff' : '#3a7bff';
          g.fillRect(Math.round(x - 3 + ((j * 7 + flick) % 3) * 2), Math.round(y - 4 - j * 4 - h * 2), 5, 5);
        }
      }
      orb(g, mx - 2, my, 4 + (flick % 2), ['#ffffff', '#a9ccff', '#3a7bff']);
      break;
    case 'hellfire': { const [m2x, m2y] = W2(8, 20); orb(g, mx, my, 3 + (flick % 2), ['#fff3a6', '#ff5a1a']); orb(g, m2x, m2y, 3 + ((flick + 1) % 2), ['#fff3a6', '#ff5a1a']); break; }
    case 'chainsaw': { const spr = sawSprite(Math.floor(t * 24) % 4); g.drawImage(spr, Math.round(mx - 30), Math.round(my - 30), 60, 60); break; }
    case 'skull': g.drawImage(skullSprite(), Math.round(mx - 14), Math.round(my - 14), 28, 26); orb(g, mx + 2, my - 14, 3 + (flick % 3), ['#ffd24a', '#ff5a1a']); break;
    case 'nova': {
      const p = 0.5 + 0.5 * Math.sin(t * 6);
      const [a1, b1] = W2(24, 19), [a2, b2] = W2(62, 40);
      g.strokeStyle = p > 0.5 ? '#7dff9a' : '#39ff6a'; g.lineWidth = 15; g.beginPath(); g.moveTo(a1, b1); g.lineTo(a2, b2); g.stroke();
      orb(g, mx, my, Math.round(7 + p * 3), ['#eaffef', '#39ff6a']);
      break;
    }
    case 'photon': orb(g, mx, my, 3 + (flick % 2), ['#ffffff', '#f5c542']); break;
    case 'binary': { const [m2x, m2y] = W2(gd.muz2[0], gd.muz2[1]); orb(g, mx, my, 3 + (flick % 2), ['#ffffff', '#ff3b3b']); orb(g, m2x, m2y, 3 + ((flick + 1) % 2), ['#ffffff', '#3b7bff']); break; }
    case 'star': if (flick % 4 === 0) { g.fillStyle = '#ffffff'; g.fillRect(Math.round(mx + rand(-12, 12)), Math.round(my + rand(-12, 12)), 3, 3); } break;
    case 'supernova': {
      const p = 0.5 + 0.5 * Math.sin(t * 8);

function makeShot(gunId, sx, sy, tx, ty, view = 'fp') {
  const gd = GUNS[gunId];

}
function shotPos(sh, p) {
  if (sh.type === 'curl') {
    const cx = (sh.sx + sh.tx) / 2 - 150, cy = Math.min(sh.sy, sh.ty) - 70;
    const a = (1 - p) * (1 - p), b = 2 * (1 - p) * p, c = p * p;
    return { x: a * sh.sx + b * cx + c * sh.tx, y: a * sh.sy + b * cy + c * sh.ty };

    const q = clamp((p * sh.dur - 0.22) / (sh.dur - 0.22), 0, 1);
    const bx = lerp(sh.sx, sh.tx, 0.18), by = lerp(sh.sy, sh.ty, 0.18);
    return { x: lerp(bx, sh.tx, q), y: lerp(by, sh.ty, q) };

}
function updateShot(sh, dt) {
  sh.t += dt;

  if (p >= 1) return;
  switch (sh.type) {
    case 'fireball': for (let i = 0; i < 3; i++) spawn({ view: v, x: q.x + rand(-3, 3), y: q.y + rand(-3, 3), vx: rand(-40, 40), vy: rand(-60, 0), life: 0.3, s: randi(3, 6), c: pick(['#ffffff', '#a9ccff', '#3a7bff']), shrink: true }); break;
    case 'pellets': spawn({ view: v, x: q.x, y: q.y, vx: rand(-30, 30), vy: rand(-30, 30), life: 0.25, s: 4, c: pick(['#ffb02e', '#ff5a1a']), shrink: true }); break;
    case 'saw': spawn({ view: v, x: q.x, y: q.y + 20, vx: rand(-120, 120), vy: rand(-80, 80), life: 0.25, s: 2, c: '#ffd24a', type: 'spark' }); break;
    case 'skull': case 'boot': case 'curl':
      for (let i = 0; i < 2; i++) spawn({ view: v, x: q.x + rand(-4, 4), y: q.y + rand(-4, 4), vx: rand(-30, 30), vy: rand(-70, -10), life: 0.35, s: randi(4, 7), c: pick(['#fff3a6', '#ffb02e', '#ff5a1a', '#c81e14']), shrink: true });
      if (sh.type === 'skull') spawn({ view: v, x: q.x + 10, y: q.y + 6, vx: rand(10, 40), vy: rand(-20, 20), life: 0.6, s: 6, c: '#4a4a4a', type: 'smoke' });

    case 'orb': spawn({ view: v, x: q.x + rand(-14, 14), y: q.y + rand(-14, 14), vx: rand(-60, 60), vy: rand(-60, 60), life: 0.4, s: 4, c: pick(['#eaffef', '#7dff9a', '#39ff6a']), shrink: true }); break;

function drawBeam(g, x0, y0, x1, y1, col, w) {

  g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();

const usedPlaces = new Set();
// Builds a question: the answer goes on the octopus's barrel, other places from the same set go on the rest.
function makeQuestion(n, target) {
  const pool = G.mode === 'boss' ? TRIVIA.demon.concat(TRIVIA.chad) : TRIVIA[G.mode];
  const tier = G.mode === 'boss' ? 2 : Math.min(G.keys, 2);
  let fresh = pool.filter(p => !usedPlaces.has(p.name));
  if (fresh.length < 1) { pool.forEach(p => usedPlaces.delete(p.name)); fresh = pool.slice(); }
  const ans = pick(fresh);
  usedPlaces.add(ans.name);
  const others = shuffle(pool.filter(p => p !== ans)).slice(0, n - 1);
  const labels = [];
  for (let i = 0, k = 0; i < n; i++) labels.push(i === target ? ans.name : others[k++].name);
  return { answer: ans.name, clue: ans.clues[tier], tier, labels };
}

/* ---------- per-frame update ---------- */
const EMBER_STATES = ['INTRO', 'HIDE', 'WATCH', 'RESULT', 'BOSSINTRO', 'NEWGUN', 'AIM', 'SHOT'];
function update(dt) {

  (UPDATE[G.state] || noop)(dt);
  // Out of time to decide: counts as a miss, with no shot fired.
  if ((G.state === 'WATCH' || G.state === 'AIM') && G.deadline != null && G.time >= G.deadline) {
    G.deadline = null; G.timedOut = true; G.hitResult = 'miss'; setState('RESULT');
  }
  for (const b of G.banners) b.t += dt;
  G.banners = G.banners.filter(b => b.t < b.dur);
  for (const b of G.bubbles) b.t += dt;
  G.bubbles = G.bubbles.filter(b => b.t < b.dur);
  for (const b of G.barrels) {
    if (b.pop > 0) b.pop = Math.max(0, b.pop - dt);

  if (G.hs) stepHostage(G.hs, dt);
  G.freed.forEach(f => stepHostage(f, dt));
  updPrize(dt); updParts(dt);
  if (G.octo.vis && G.time > G.nextSlurp && (G.state === 'INTRO' || G.state === 'RESULT' || G.state === 'BOSSINTRO')) { G.nextSlurp = G.time + rand(2.5, 4.5); Sound.fx.slurp(panOf(G.octo.x)); }
  const emberView = G.state === 'AIM' || G.state === 'SHOT' ? 'fp' : 'side';
  if (((G.mode !== 'chad' && EMBER_STATES.includes(G.state)) || (G.state === 'SELECT' && G.selMode === 'demon')) && Math.random() < dt * 8) {
    spawn({ view: emberView, x: rand(0, W), y: H + 4, vx: rand(-15, 15), vy: rand(-60, -25), life: rand(3, 6), s: 2, c: pick(['#ff8a1a', '#ffb02e', '#ff5a1a']) });
  }
  FX.shake = Math.max(0, FX.shake - dt * 30);
  FX.flashA = Math.max(0, FX.flashA - dt * 2.2);
  G.recoil = Math.max(0, G.recoil - dt * 4);
}

/* =====================================================================
   ONLINE MULTIPLAYER (2 to 6 players, everyone on their own device)
   Chad Mode: 3 questions (5 with 4+ players). Everyone gets the same clue;
   the FASTEST correct shot (reaction time, measured on each player's own
   screen from when the clue appeared) takes the key, a wrong shot locks you
   out of that question, and nobody sees anyone else's shot until the reveal.
   3 keys wins outright. Otherwise the top two go through (a sudden-death
   question settles a tie at the cut). The lowest scorer becomes the octopus
   and secretly picks its barrel and how hard the clue is; if the lowest score
   is tied, the computer runs the octopus and holds the tied players as its
   captives. Anyone else watches. With 2 players the computer is the octopus.
   Demon Time: the two finalists duel on 8 barrels, first to 3 wins.

   Transport: in the claude.ai version, the page's live room; in the Portal,
   the arcade window passes messages to the Portal's own live channel. One
   device (the referee) runs the rules and shares the game state; players
   share their shots. If the referee leaves, the next player takes over and
   the question is asked again.
   ===================================================================== */
const MP_COLS = ['#ff5a74', '#4fb3ff', '#7dff9a', '#ffd24a', '#c27bff', '#ff9a3c'];
const MP_TAGS = ['RED', 'BLUE', 'GREEN', 'YELLOW', 'PURPLE', 'ORANGE'];
const MP_CHAD = ['trump', 'spidey', 'jerry', 'mj', 'flaglady', 'tom'];
const MP_DEMON = ['slayer', 'marvel', 'messi', 'slayer', 'marvel', 'messi'];
const MP_SECS = { intro: 2.4, hide: 1.5, ask: CFG.decideSeconds, reveal: 3.4, standings: 4.5, pick: 20, grace: 0.8 };
const MP_TIERS = ['EASY', 'MEDIUM', 'HARD'];
const MP_MAX = 6;
const MP_CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ';

const MP = {
  S: null,              // shared game state, published by the referee
  R: null,              // referee-only: { target, answer, correct: [{seat, rt}], firstAt, shots: [{p, b}] }
  endAt: 0, prev: null, phaseAt: 0, askAt: 0,
  net: null, netP: null, lobby: null, myPeer: null, nick: '', names: {},
  ui: 'off',            // off | connecting | menu | joining | lobby | unavailable
  code: '', typed: '', note: '', noteAt: 0, pickB: -1, myShot: null, peers: [], missing: {},

/* ---------- transport ---------- */
// Either the claude.ai room or the Portal bridge, in one small shape:
//   join(name) -> { presence(patch), onPeers(fn([{peer, by, me, presence}])), leave() }
//   arcade     -> who else has the game open, and play requests (see 066-arcade.js)
function mpProvider() {
  if (!MP.netP) MP.netP = mpFindProvider().then(net => (MP.net = net));
  return MP.netP;
}
async function mpFindProvider() {
  if (window.claude && window.claude.use) {
    try {
      const room = await window.claude.use('room');
      if (room) {
        const user = await window.claude.use('user');
        let nick = '';
        try { const me = user && (await user.me()); nick = (me && me.name) || ''; } catch (e) { /* optional */ }
        const profiles = user ? ids => user.profiles(ids) : null;
        return {
          nick, profiles,
          arcade: arcRoomAdapter(room, nick, profiles),
          async join(name) {
            const lob = await room.join(name);
            return {
              presence: p => lob.presence(p),
              onPeers: fn => lob.onPeers(ch => fn(ch.peers.map(p => ({ peer: p.peer, by: p.by, me: p.sameTab, presence: p.presence || {} })))),
              leave: () => lob.leave(),

}
// The Portal: the arcade window (parent page) owns the live channels; we talk to it by postMessage.
const mpPost = msg => { try { window.parent.postMessage(msg, '*'); } catch (e) { /* parent gone */ } };
function mpBridge() {
  if (!window.parent || window.parent === window) return Promise.resolve(null);
  return new Promise(resolve => {
    let done = false, peersFn = null, arcFn = null, arcLast = null;
    window.addEventListener('message', e => {
      if (e.source !== window.parent) return;
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.cvd === 'hello-ack' && !done) {
        done = true;
        MP.inPortal = true;   // the Portal's arcade window: Escape goes back to work (see 07-boot)
        resolve({
          nick: typeof d.name === 'string' ? d.name : '',
          profiles: null,
          arcade: {
            hostIncoming: true,     // the Portal shows incoming requests itself, on every arcade screen
            onUpdate: fn => { arcFn = fn; if (arcLast) fn(arcLast); },
            invite: (to, code) => mpPost({ cvd: 'arc-invite', to, code }),
            respond: (from, code, ok) => mpPost({ cvd: 'arc-respond', from, code, ok }),
            cancel: () => mpPost({ cvd: 'arc-cancel' }),
            setBusy: busy => mpPost({ cvd: 'arc-busy', busy: !!busy }),
          },
          async join(name) {
            mpPost({ cvd: 'join', room: name });
            return {
              presence: async p => { mpPost({ cvd: 'presence', patch: p }); },
              onPeers: fn => { peersFn = fn; },
              leave: async () => { peersFn = null; mpPost({ cvd: 'leave' }); },
            };
          },
        });
        if (d.launch) setTimeout(() => mpLaunch(d.launch), 0);
      } else if (d.cvd === 'peers' && Array.isArray(d.peers) && peersFn) {
        peersFn(d.peers.map(p => ({ peer: String(p.peer), by: null, me: !!p.me, presence: p.presence && typeof p.presence === 'object' ? p.presence : {} })));
      } else if (d.cvd === 'arcade') {
        arcLast = arcClean(d);
        if (arcFn) arcFn(arcLast);
      } else if (d.cvd === 'launch' && done) mpLaunch(d.launch);
    });
    let tries = 0;
    const hello = () => { if (done) return; if (tries++ > 8) { done = true; resolve(null); return; } mpPost({ cvd: 'hello' }); setTimeout(hello, 250); };
    hello();
  });
}

/* ---------- helpers ---------- */

  const n = (p.uid && MP.names[p.uid]) || p.nick || MP_TAGS[i];

}

}
function mpQuestion(pool, n, target, tier) {
  let fresh = pool.filter(p => !usedPlaces.has(p.name));
  if (fresh.length < 1) { pool.forEach(p => usedPlaces.delete(p.name)); fresh = pool.slice(); }
  const ans = pick(fresh); usedPlaces.add(ans.name);
  const others = shuffle(pool.filter(p => p !== ans)).slice(0, n - 1);
  const labels = [];

    q: null, reveal: null, sudden: null, finalists: [], octo: -1, captives: [], winner: -1, msg: '', goTo: '',

/* =====================================================================
   THE ARCADE: who else is here right now, and requests to play
   Everyone with the game open shows up on the online screens with a
   REQUEST button. Sending one starts a game (if you are not in one yet)
   and offers the other person its code; they get ACCEPT / REJECT and
   accepting drops them straight into your lobby.
   In the Portal the arcade window keeps this list for us (it also knows
   who is on the arcade's other games) and shows incoming requests itself,
   on whatever arcade screen the person is on. On claude.ai the page's own
   room is the arcade and the game shows the request.
   ===================================================================== */
const ARC = { api: null, peers: [], sent: [], incoming: [], busy: false, seen: {}, answered: {} };
const ARC_TTL = 120;          // seconds a request stays on screen
const ARC_ROWS = 7;
const ARC_PLACES = { chad: 'PLAYING CHAD MODE', menu: 'PICKING A GAME', maze: 'PLAYING AMPERSAND MAZE', looseChange: 'PLAYING LOOSE CHANGE' };

// whatever reaches us from outside is checked before we draw it
function arcClean(d) {
  const str = (v, n) => (typeof v === 'string' ? v : '').slice(0, n);
  const code = v => (typeof v === 'string' && /^[A-Z]{6}$/.test(v) ? v : '');
  const arr = v => (Array.isArray(v) ? v.slice(0, 40) : []);
  return {
    peers: arr(d.peers).map(p => ({ id: str(p && p.id, 80), name: str(p && p.name, 40) || 'SOMEONE', where: str(p && p.where, 20), busy: !!(p && p.busy) })).filter(p => p.id),
    sent: arr(d.sent).map(s => ({ to: str(s && s.to, 80), code: code(s && s.code), status: str(s && s.status, 10) })).filter(s => s.to && s.code),
    incoming: arr(d.incoming).map(r => ({ from: str(r && r.from, 80), name: str(r && r.name, 40) || 'SOMEONE', code: code(r && r.code) })).filter(r => r.from && r.code),
  };
}
// claude.ai: the page's lobby room carries everyone's { arc } presence
function arcRoomAdapter(room, nick, profiles) {
  const me = { nick: nick || '', where: 'chad', busy: false, inv: [], ans: [] };
  let peers = [], fn = null;
  const names = {};
  const push = () => { room.presence({ arc: me }).catch(noop); };
  const label = p => {
    const a = (p.presence && p.presence.arc) || {};
    return (p.by && names[p.by]) || (typeof a.nick === 'string' && a.nick) || 'SOMEONE';
  };
  const compute = () => {
    if (!fn) return;
    const mine = peers.find(p => p.sameTab), myId = mine ? mine.peer : null;
    const others = peers.filter(p => !p.sameTab && p.presence && p.presence.arc && typeof p.presence.arc === 'object');
    const list = others.map(p => ({ id: p.peer, name: label(p), where: 'chad', busy: !!p.presence.arc.busy }));
    const sent = me.inv.map(i => {
      const t = others.find(p => p.peer === i.to);
      if (!t) return { to: i.to, code: i.code, status: 'gone' };
      const a = (Array.isArray(t.presence.arc.ans) ? t.presence.arc.ans : []).find(x => x && x.to === myId && x.code === i.code);
      return { to: i.to, code: i.code, status: a ? (a.ok ? 'accepted' : 'rejected') : 'pending' };
    });
    const incoming = [];
    for (const p of others) {
      for (const i of Array.isArray(p.presence.arc.inv) ? p.presence.arc.inv : []) {
        if (!i || i.to !== myId) continue;
        if (me.ans.some(a => a.to === p.peer && a.code === i.code)) continue;
        incoming.push({ from: p.peer, name: label(p), code: i.code });
      }
    }
    fn(arcClean({ peers: list, sent, incoming }));
  };
  room.onPeers(ch => {
    peers = ch.peers;
    const ids = peers.map(p => p.by).filter(id => id && !(id in names));
    if (profiles && ids.length) {
      ids.forEach(id => (names[id] = ''));
      profiles(ids).then(ps => { for (const id in ps) names[id] = (ps[id] && ps[id].name) || ''; compute(); }).catch(noop);
    }
    compute();
  });
  push();
  return {
    hostIncoming: false,
    onUpdate: f => { fn = f; compute(); },
    invite: (to, code) => { me.inv = me.inv.filter(i => i.to !== to).concat({ to, code }).slice(-8); push(); compute(); },
    respond: (from, code, ok) => { me.ans = me.ans.filter(a => a.to !== from).concat({ to: from, code, ok: !!ok }).slice(-12); push(); compute(); },
    cancel: () => { if (!me.inv.length) return; me.inv = []; push(); compute(); },
    setBusy: busy => { if (me.busy === !!busy) return; me.busy = !!busy; push(); compute(); },
  };
}

function arcBoot() {
  mpProvider().then(net => {
    if (!net || !net.arcade) return;
    ARC.api = net.arcade;
    ARC.api.onUpdate(arcUpdate);
    ARC.api.setBusy(ARC.busy);
  }).catch(noop);
}
function arcUpdate(d) {
  ARC.peers = d.peers; ARC.sent = d.sent;
  const inc = [];
  for (const r of d.incoming) {
    const k = r.from + '|' + r.code;
    if (ARC.answered[k]) continue;
    if (!(k in ARC.seen)) { ARC.seen[k] = G.time; if (!ARC.api.hostIncoming) { Sound.fx.coin(); announce(r.name + ' wants to play Octrivia online with you'); } }
    inc.push(Object.assign({ at: ARC.seen[k] }, r));
  }
  ARC.incoming = inc;
}
function arcBusy(b) { ARC.busy = !!b; if (ARC.api) ARC.api.setBusy(ARC.busy); }
function arcCancel() { if (ARC.api) ARC.api.cancel(); }
const arcSentTo = id => ARC.sent.find(s => s.to === id && s.code === MP.code);
async function arcRequest(p) {
  if (!ARC.api) return;
  if (p.busy) { mpSay(p.name.toUpperCase() + ' IS IN A GAME ALREADY'); return; }
  const s = arcSentTo(p.id);
  if (s && s.status !== 'gone') return;
  if (MP.ui === 'menu') { await mpCreate(); if (MP.ui !== 'lobby') return; }
  else if (MP.ui !== 'lobby') return;
  if (mpPlayers().length >= MP_MAX) { mpSay('THE GAME IS FULL'); return; }
  ARC.api.invite(p.id, MP.code);
  Sound.fx.blip();
}
function arcRespond(r, ok) {
  if (!ARC.api) return;
  ARC.answered[r.from + '|' + r.code] = 1;
  ARC.incoming = ARC.incoming.filter(x => x !== r);
  ARC.api.respond(r.from, r.code, ok);
  if (ok) { Sound.fx.select(); mpLaunch({ join: r.code }); } else Sound.fx.blip();
}
// the request on screen right now (claude.ai only; the Portal draws its own)
function arcShown() {
  if (!ARC.api || ARC.api.hostIncoming) return null;
  return ARC.incoming.find(r => G.time - r.at < ARC_TTL && r.code !== MP.code) || null;
}

/* ---------- the "in the arcade" list on the online screens ---------- */
const ARC_PANEL = { x: 330, y: 60, w: 296, h: 262 };
function arcRowBtn(i) { return { x: ARC_PANEL.x + ARC_PANEL.w - 54, y: ARC_PANEL.y + 40 + i * 31, w: 96, h: 22 }; }

  if (s && s.status === 'rejected') return { label: 'SAID NO', col: '#ff8a8a', on: false };
  if (p.busy) return { label: 'BUSY', col: '#5a4f80', on: false };
  return { label: 'REQUEST', col: '#ffffff', on: true };
}

    const where = p.busy ? 'IN AN ONLINE GAME' : ARC_PLACES[p.where] || 'IN THE ARCADE';
    text(g, where, P.x + 12, y + 16, { s: 1, c: '#8f86c0', o: null });

    g.fillStyle = btn.on ? '#3a2a70' : '#1e1838'; g.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);

  });
  if (ARC.peers.length > ARC_ROWS) text(g, '+' + (ARC.peers.length - ARC_ROWS) + ' MORE', P.x + P.w / 2, P.y + P.h - 14, { s: 1, c: '#c9c2ff', al: 'c', o: null });
}
function arcListPointer(x, y) {
  const P = ARC_PANEL;
  if (x < P.x || x > P.x + P.w || y < P.y || y > P.y + P.h) return false;

  return true;
}

/* ---------- the request popup (claude.ai) ---------- */
const ARC_POP = { x: W / 2, y: 176, w: 420, h: 124 };
const ARC_YES = { x: W / 2 - 80, y: 212, w: 140, h: 30 }, ARC_NO = { x: W / 2 + 80, y: 212, w: 140, h: 30 };
function drawArcadeIncoming(g) {

// Phones and iPads: no SHOOT deck and a thin frame, so the game screen is as big as the display allows.

// Sideways: the screen takes the full height, with PAUSE and SOUND in a narrow column beside it.
function layoutTouch(aw, ah) {
  const side = aw > ah * 1.05;
  const pad = 2, gap = 4, bez = clamp(Math.round(Math.min(aw, ah) * 0.005), 2, 5);   // a thin frame: every pixel goes to the screen
  let sw, barH = 0, barW = 0;
  if (side) {
    barW = clamp(Math.round(aw * 0.085), 62, 96);
    sw = Math.floor(Math.min(aw - 2 * pad - 2 * bez - gap - barW, (ah - 2 * pad - 2 * bez) * 16 / 9));
  } else {
    barH = clamp(Math.round(ah * 0.06), 44, 64);
    sw = Math.floor(Math.min(aw - 2 * pad - 2 * bez, (ah - 2 * pad - 2 * bez - barH - 2 * gap - 210) * 16 / 9));   // keep 210px for the pad
  }

  const spare = side ? 0 : ah - 2 * pad - 2 * bez - barH - 2 * gap - sh;

  st.setProperty('--screen-w', sw + 'px'); st.setProperty('--screen-h', sh + 'px'); st.setProperty('--deck-w', w + 'px');
  st.setProperty('--bar-h', barH + 'px'); st.setProperty('--bar-w', barW + 'px'); st.setProperty('--pad-h', padH + 'px');
  st.setProperty('--pad-cols', w < 520 ? '2' : '4');
  st.setProperty('--gap', gap + 'px'); st.setProperty('--cab-pad', pad + 'px'); st.setProperty('--bezel-pad', bez + 'px');
  st.setProperty('--side-w', '0px');

  cab.classList.toggle('sideways', side);
  cab.classList.remove('compact', 'nomq', 'narrow');

let mqT = 0;
function drawMarquee() {
  const cssW = mqC.clientWidth, cssH = mqC.clientHeight;
  if (!cssW || !cssH) return;
  const k = Math.max(1, Math.floor(cssH / 24)), w = Math.max(1, Math.round(cssW / k)), h = Math.max(1, Math.round(cssH / k));
  if (mqC.width !== w || mqC.height !== h) { mqC.width = w; mqC.height = h; }
  const g = mqC.getContext('2d'); g.imageSmoothingEnabled = false;
  for (let x = 0; x < w; x += 2) { g.fillStyle = mix('#0a2a4a', '#3a0812', x / w); g.fillRect(x, 0, 2, h); }
  const phase = Math.floor(mqT * 6);
  for (let x = 3, i = 0; x < w - 2; x += 6, i++) { g.fillStyle = (i + phase) % 3 === 0 ? '#ffe48a' : '#5a4a22'; g.fillRect(x, 1, 2, 2); g.fillRect(x, h - 3, 2, 2); }
  const total = 'OCTRIVIA'.length * 6 + 1, s = Math.max(1, Math.floor(Math.min((w - 6) / total, (h - 8) / 9)));
  let x = Math.round(w / 2 - (total * s) / 2);
  const y = Math.round(h / 2 - (9 * s) / 2);
  for (const [str, col] of [['OCT', ROWS.cyan], ['RIVIA', ROWS.gold]]) x += text(g, str, x, y, { s, c: col }) - 2 * s;
}
function drawSideArt() {
  [[sideL, 'octo', '#0a2a4a'], [sideR, 'demon', '#2a0a3a']].forEach(([c, id, col]) => {
    if (c.hidden) return;
    const cssW = c.clientWidth, cssH = c.clientHeight;
    if (!cssW || !cssH) return;
    const k = Math.max(1, Math.round(cssW / 28)), w = Math.round(cssW / k), h = Math.round(cssH / k);
    c.width = w; c.height = h;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    for (let y = 0; y < h; y += 2) { g.fillStyle = mix(col, '#07051a', y / h); g.fillRect(0, y, w, 2); }
    const rnd = seeded(id === 'octo' ? 5 : 9);
    for (let i = 0; i < 14; i++) { g.fillStyle = id === 'octo' ? '#8fe3ff' : '#ffb02e'; g.fillRect(Math.floor(rnd() * w), Math.floor(rnd() * h), 1, 1); }
    const u = (w - 2) / 34;
    drawChar(g, id, w / 2, Math.round(h * 0.42), u, { mood: 'smug', tf: 1 });
    drawChar(g, id === 'octo' ? 'spidey' : 'slayer', w / 2, Math.round(h * 0.86), u * 0.8, {});
  });
}
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(room);
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 120));

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (!G.paused) update(dt);
  render();
  syncPad();
  mqT += dt;
  if (Math.floor(mqT * 6) !== Math.floor((mqT - dt) * 6)) drawMarquee();

}
function start(data) {

}
// handy for testing in the browser console; step(dt) runs one frame by hand (the loop stops in a hidden tab)
window.__cvd = { G, setState, CFG, onShoot, chooseBarrel, retryStage, step(dt = 1 / 60) { if (!G.paused) update(dt); render(); syncPad(); } };

else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
